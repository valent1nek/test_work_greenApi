<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<label class="input">
    <input placeholder="idInstance" type="number" id="inputIdInst">
    <input placeholder="APITokenInstance" id="inputApiInst">
</label>
<hr>
<button class="input" id="btnGetSettings" onclick="getSettings()">getSettings</button>
<button class="input">getStateInstance</button>
<hr>
<label class="input">
    <input placeholder="number">
    <textarea placeholder="TEXT"></textarea>
    <button class>sendMessage</button>
</label>
<hr>
<label class="input">
    <input placeholder="number">
    <textarea placeholder="TEXT"></textarea>
    <button>sendFileByUrl</button>
</label>
<h1>RESPONSE</h1>
<label>
    <textarea placeholder="RESPONSE" id="responseArea" class="response_area" readonly></textarea>
</label>
</body>
</html>

<script>
    const id = document.getElementById("inputIdInst")
    const apiToken = document.getElementById("inputApiInst")
    const responseArea = document.getElementById("responseArea")

    const getUrl = (nameMethod) => {
        const idInstance = id.value;
        const apiTokenInstance = apiToken.value;
        return `https://7201.api.green-api.com/waInstance${idInstance}/${nameMethod}/${apiTokenInstance}`
    }


    const getSettings = async () => {
        responseArea.value = "";
        const nameMethod = "getSettings"

        const url = getUrl(nameMethod)

        const response = await fetch(url);
        const data = await response.json();

        responseArea.value = JSON.stringify(data, null, 2);
    }

    const getStateInstance = async () => {
        responseArea.value = "";
        const nameMethod = "getStateInstance"

        const url = getUrl(nameMethod)

        const response = await fetch(url);
        const data = await response.json();

        responseArea.value = JSON.stringify(data, null, 2);
    }
</script>
