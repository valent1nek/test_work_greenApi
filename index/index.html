<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<label class="input">
    <input placeholder="idInstance" type="number" id="inputIdInst">
    <input placeholder="APITokenInstance" id="inputApiInst">
</label>
<hr>
<button class="input" id="btnGetSettings" onclick="getSettings()">getSettings</button>
<button class="input" onclick="getStateInstance()">getStateInstance</button>
<hr>
<label class="input">
    <input placeholder="number" type="number" id="phoneNumberInput">
    <textarea placeholder="TEXT" id="messageInput"></textarea>
    <button class onclick="sendMessage()">sendMessage</button>
</label>
<hr>
<label class="input">
    <input placeholder="number" id="filePhoneInput">
    <textarea placeholder="TEXT" id="urlInput"></textarea>
    <button onclick="sendFileByUrl()">sendFileByUrl</button>
</label>
<h1>RESPONSE</h1>
<label>
    <textarea placeholder="RESPONSE" id="responseArea" class="response_area" readonly></textarea>
</label>
</body>
</html>

<script>
    const id = document.getElementById("inputIdInst")
    const apiToken = document.getElementById("inputApiInst")
    const responseArea = document.getElementById("responseArea")

    const messageInput = document.getElementById("messageInput");
    const phoneNumberInput = document.getElementById("phoneNumberInput");

    const filePhoneInput = document.getElementById("filePhoneInput");
    const urlInput = document.getElementById("urlInput");

    const getUrl = (nameMethod) => {
        // const idInstance = id.value;
        // const apiTokenInstance = apiToken.value;

        const idInstance = "720122735141";
        const apiTokenInstance = "02f930081d334a2ea524f6d094c49c08d00c7d4bee9b41f1b7";
        return `https://7201.api.green-api.com/waInstance${idInstance}/${nameMethod}/${apiTokenInstance}`
    }


    const getSettings = async () => {
        responseArea.value = "";
        const nameMethod = "getSettings"

        const url = getUrl(nameMethod)

        const response = await fetch(url);
        const data = await response.json();

        responseArea.value = JSON.stringify(data, null, 2);
    }

    const getStateInstance = async () => {
        responseArea.value = "";
        const nameMethod = "getStateInstance"

        const url = getUrl(nameMethod)

        const response = await fetch(url);
        const data = await response.json();

        responseArea.value = JSON.stringify(data, null, 2);
    }

    const sendMessage = async () => {
        responseArea.value = "";
        const phone = phoneNumberInput.value;
        const message = messageInput.value;

        const body = {
            chatId: `${phone}@c.us`,
            message: `${message}`,
        }

        const nameMethod = "sendMessage"

        const url = getUrl(nameMethod)

        const response = await fetch(url,{
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        responseArea.value = JSON.stringify(data, null, 2);
    }

    const sendFileByUrl = async () => {
        responseArea.value = "";
        const phone = filePhoneInput.value;
        const urlFile = urlInput.value;

        const fileName = urlFile.split("/").pop();
        const name = fileName.split(".").pop();

        const body = {
            chatId: `${phone}@c.us`,
            urlFile: urlFile,
            fileName: name
        }

        const nameMethod = "sendFileByUrl"

        const url = getUrl(nameMethod)

        const response = await fetch(url,{
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        responseArea.value = JSON.stringify(data, null, 2);
    }
</script>
