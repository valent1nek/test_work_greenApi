<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GREEN-API Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="controls">
        <input id="inputIdInst" placeholder="idInstance">
        <input id="inputApiInst" placeholder="ApiTokenInstance">
        <button onclick="getSettings()">getSettings</button>
        <button onclick="getStateInstance()">getStateInstance</button>
        <div class="block">
            <input id="phoneNumberInput" placeholder="77071234567">
            <textarea id="messageInput" placeholder="Hello World"></textarea>
            <button onclick="sendMessage()">sendMessage</button>
        </div>
        <div class="block">
            <input id="filePhoneInput" placeholder="77071234567">
            <input id="urlInput" placeholder="https://example.com/image.jpg">
            <button onclick="sendFileByUrl()">sendFileByUrl</button>
        </div>
    </div>
    <div class="response">
        <h3>Ответ:</h3>
        <textarea id="responseArea" readonly placeholder="Здесь будет ответ API"></textarea>
    </div>
</div>
<footer>
    GREEN API © 2025
</footer>
<script src="index.js"></script>
</body>
</html>
